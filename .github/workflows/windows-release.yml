name: Windows release build

# Builds the portable Windows .7z with build_eddyflow_windows.ps1 from the
# private eddyflow-build-script repository, checks the folder it contains, and
# attaches it to the release, next to the macOS .dmg and the Linux packages.
#
# The toolchains are the ones the build script's README names: Qt 6.11.1 with
# the Qt MinGW 13.1 kit for the GUI, and WinLibs GCC 15.2.0 (UCRT) for the
# Fortran engine. Qt comes from aqtinstall, so no extra action is needed.
#
# Needs the repository secret BUILD_SCRIPT_TOKEN: a fine-grained token with
# read-only Contents access to kebasaa/eddyflow-build-script.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the .7z to, e.g. v8.1.5
        required: true
      engine_ref:
        description: eddyflow-engine branch, tag or commit (default the same tag)
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ENGINE_REF: ${{ inputs.engine_ref || github.event.release.tag_name || inputs.tag }}
      QT_VERSION: 6.11.1
      AQTINSTALL_COMMIT: 5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
      QT_BIN: C:\Qt\6.11.1\mingw_64\bin
      GUI_MINGW_BIN: C:\Qt\Tools\mingw1310_64\bin
      ENGINE_MINGW_BIN: C:\mingw64\bin
      WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-13.0.0-ucrt-r6/winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-13.0.0-r6.7z
      WINLIBS_SHA256: 4ed329d4b2e8292d3f1b8defb17276c3f359d301e24d5693a9b026f037ecf58f
    defaults:
      run:
        shell: pwsh
    steps:
      # The build script expects the three repositories side by side, with its
      # own folder named eddyflow-build-script.
      - name: Check out eddyflow-gui at ${{ env.TAG }}
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: eddyflow-gui

      - name: Check out eddyflow-engine at ${{ env.ENGINE_REF }}
        uses: actions/checkout@v7
        with:
          repository: kebasaa/eddyflow-engine
          ref: ${{ env.ENGINE_REF }}
          path: eddyflow-engine

      - name: Check out eddyflow-build-script
        uses: actions/checkout@v7
        with:
          repository: kebasaa/eddyflow-build-script
          ref: main
          token: ${{ secrets.BUILD_SCRIPT_TOKEN }}
          path: eddyflow-build-script

      # aqtinstall 3.3.0, the latest release, cannot read the repository layout
      # Qt uses from 6.11 on; support for it is on master since March 2026
      # (miurahr/aqtinstall#1000), so a master commit is pinned until a
      # release has it.
      - name: Install Qt ${{ env.QT_VERSION }} and its MinGW
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check "aqtinstall @ git+https://github.com/miurahr/aqtinstall@$env:AQTINSTALL_COMMIT"
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_mingw -m qt5compat -O C:\Qt
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 -O C:\Qt
          foreach ($tool in "$env:QT_BIN\qmake.exe", "$env:QT_BIN\windeployqt.exe", "$env:GUI_MINGW_BIN\g++.exe") {
            if (-not (Test-Path -LiteralPath $tool)) { throw "Missing after the Qt install: $tool" }
          }

      - name: Install the engine's MinGW (WinLibs, with gfortran)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs.7z'
          Invoke-WebRequest -Uri $env:WINLIBS_URL -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($hash -ne $env:WINLIBS_SHA256) { throw "WinLibs SHA256 mismatch: $hash" }
          7z x $archive -oC:\ -y -bd | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Extracting WinLibs failed" }
          & "$env:ENGINE_MINGW_BIN\gfortran.exe" --version

      # The GUI and the engine build with CMake and Ninja, from WinLibs.
      #
      # An engine tag from before CMake still builds with its Makefile, which
      # uses cmd syntax (if exist ... del), and mingw32-make switches to sh as
      # soon as an sh.exe is on PATH. Git puts one there on the runner, so
      # those folders are dropped for this step until no such tag needs
      # rebuilding. CMake and Ninja do not care either way.
      - name: Build the portable .7z
        run: |
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'sh.exe')) }) -join ';'
          .\eddyflow-build-script\build_eddyflow_windows.ps1 `
            -QtBin $env:QT_BIN `
            -GuiMinGwBin $env:GUI_MINGW_BIN `
            -MinGwBin $env:ENGINE_MINGW_BIN `
            -Make "$env:ENGINE_MINGW_BIN\mingw32-make.exe"

      - name: Keep the .7z with the run
        uses: actions/upload-artifact@v7
        with:
          name: eddyflow-windows-x86_64
          path: eddyflow-portable_v*_windows_x86_64.7z
          if-no-files-found: error
          retention-days: 14

      - name: Check the portable folder in the .7z
        run: |
          $archive = Get-ChildItem -Path 'eddyflow-portable_v*_windows_x86_64.7z' | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'portable-check'
          7z x $archive.FullName "-o$out" -y -bd | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Extracting $($archive.Name) failed" }
          $app = Join-Path $out 'eddyflow-portable'

          foreach ($path in 'eddyflow.exe', 'platforms\qwindows.dll', 'bin\eddyflow_rp.exe', 'bin\eddyflow_fcc.exe', 'bin\7z.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $app $path) -PathType Leaf)) { throw "Missing from the package: $path" }
          }
          foreach ($dir in 'docs', 'file-templates') {
            if (-not (Test-Path -LiteralPath (Join-Path $app $dir) -PathType Container)) { throw "Missing from the package: $dir" }
          }

          # Only Windows' own folders on PATH: every other DLL must come from
          # the package itself, as on a user's machine.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          & "$app\bin\eddyflow_rp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "eddyflow_rp --version failed ($LASTEXITCODE)" }
          & "$app\bin\eddyflow_fcc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "eddyflow_fcc --version failed ($LASTEXITCODE)" }
          & "$app\bin\7z.exe" i > (Join-Path $env:RUNNER_TEMP '7z-info.txt')
          if ($LASTEXITCODE -ne 0) { throw "7z i failed ($LASTEXITCODE)" }

          # The GUI must start and keep running; it is stopped after 15 s.
          $gui = Start-Process -FilePath "$app\eddyflow.exe" -WorkingDirectory $app -PassThru
          Start-Sleep -Seconds 15
          if ($gui.HasExited) {
            Write-Output "::error::the GUI exited early (exit code $($gui.ExitCode))"
            exit 1
          }
          Stop-Process -Id $gui.Id -Force
          $global:LASTEXITCODE = 0

      # --clobber replaces a .7z of the same name when a release is rebuilt.
      - name: Attach the .7z to release ${{ env.TAG }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" eddyflow-portable_v*_windows_x86_64.7z --clobber --repo "$GITHUB_REPOSITORY"
